  <style>
    :root { --bg: #0f0a17; --text: #ecd9c0; --muted: #b7a291; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #f4ecdf; --text: #2b1f1a; --muted: #5d4a3e; color-scheme: light; } }

<body>
<main>
  <h1>Harpy examples</h1>
  <p>Step through with the arrows, the diamonds, or <kbd>←</kbd> <kbd>→</kbd> once a diagram has focus. Switch to <em>Side by side</em> to edit the source live.</p>

  <h2>Flowchart with responsibilities</h2>
  <harpy-diagram id="checkout">
    <script type="text/harpy">
      # Checkout, end to end

      Who owns which part of an order, from the browser to the warehouse.

      ```harpy
      flowchart LR
      %% @step browse "In the browser"
        subgraph FE [Storefront]
          U([Customer]) --> C[Cart]
        end
      %% @step pay "Paying" focus=P
        subgraph API [Order service]
          C --> P{Payment OK?}
          P -->|yes| O[Create order]
          P -->|no| R[Show error]
        end
        R -.-> C
      %% @step persist "Persisting"
        O --> DB[(Orders DB)]
      %% @step ship "Fulfilment"
        subgraph WH [Warehouse]
          K[Pick & pack] --> S[Ship]
        end
        O --> K
      ```

      ## browse
      The customer adds items. Nothing leaves the **storefront** yet: the cart lives in session storage.

      ## pay
      The order service asks the payment provider and waits at most `5s` for an answer.

      ## persist
      Only a successful payment writes anything: one row in the orders database.

      ## ship
      The warehouse picks the order up from a queue and handles it asynchronously.

      ## summary
      Three teams, three colours: the storefront owns the cart, the order service owns money and
      data, and the warehouse owns everything physical.
    </script>
  </harpy-diagram>

  <h2>Sequence diagram with groups, side by side</h2>
  <harpy-diagram mode="split">
    <script type="text/harpy">
      # Logging in

      ```harpy
      sequenceDiagram
        box lapis Client
          actor U as User
          participant B as Browser
        end
        box verdigris Backend
          participant A as API
          participant D@{ "type": "database" } as Users DB
        end
      %% @step request "Credentials"
        U->>B: submit the form
        B->>+A: POST /login
      %% @step check "Checking the password" focus=A,D
        A->>D: find user by email
        D-->>A: user + bcrypt hash
        Note over A,D: The hash never leaves the backend
      %% @step token "Answering"
        alt password matches
          A-->>B: 200 + session cookie
        else wrong password
          A-->>-B: 401
        end
        B-->>U: show the result
      ```

      ## request
      The browser posts the credentials to the API over HTTPS.

      ## check
      The API loads the user and compares the password with the stored **bcrypt** hash.

      ## token
      A match sets a short-lived session cookie. A mismatch returns `401` without saying which part was wrong.

      ## summary
      The database never sees the plain password, and the browser never sees the hash.
    </script>
  </harpy-diagram>
</main>
</body>
</html>
